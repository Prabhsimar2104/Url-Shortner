services:
  backend:
    build: .
    container_name: short-my-url-backend
    ports:
      - "7777:7777"
    environment:
      PORT: 7777
      BASE_URL: http://localhost:7777
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/short_my_url
      REDIS_URL: redis://redis:6379
      REDIS_COUNTER_KEY: url_shortener_counter
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    container_name: short-my-url-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: short_my_url
    ports:
      - "7778:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: short-my-url-redis
    ports:
      - "7779:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data: